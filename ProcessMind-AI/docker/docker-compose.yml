version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: processmind-postgres
    environment:
      POSTGRES_DB: processmind_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - processmind-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: processmind-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/processmind_db
      DB_USERNAME: postgres
      DB_PASSWORD: 123
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/logs:/app/logs
    networks:
      - processmind-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  processmind-network:
    driver: bridge